<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Soft sky background -->
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EBF4FF"/>
    </radialGradient>
    <!-- C stroke: bright blue-violet → vibrant mint, top to bottom -->
    <linearGradient id="cg" x1="52" y1="33" x2="52" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B8DEE"/>
      <stop offset="100%" stop-color="#20C997"/>
    </linearGradient>
    <!-- Soft drop shadow -->
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#5B8DEE" flood-opacity="0.25"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#20C997" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect x="0.9" y="0.9" width="98.2" height="98.2" rx="21.3"
        fill="none" stroke="#D8EAFF" stroke-width="1.2"/>

  <!-- C arc: center(52,50), r=22, stroke 8 — visually centered with badges -->
  <path d="M 66,33 A 22,22 0 1 0 66,67"
        stroke="url(#cg)" stroke-width="8"
        stroke-linecap="butt" fill="none"/>

  <!-- Top badge: blue + airplane ✈ -->
  <circle cx="66" cy="33" r="9" fill="#5B8DEE" filter="url(#sh)"/>
  <g transform="translate(66,33) rotate(-40)">
    <path d="M 0,-5.2
             L 1.8,-1.3  L 5.8,0.4
             L 1.8,1.5   L 1.5,5
             L 0,3.6
             L -1.5,5    L -1.8,1.5
             L -5.8,0.4  L -1.8,-1.3
             Z"
          fill="white"/>
  </g>

  <!-- Bottom badge: mint + map pin -->
  <circle cx="66" cy="67" r="9" fill="#20C997" filter="url(#sh2)"/>
  <g transform="translate(66,67)">
    <g transform="scale(0.56)">
      <!-- teardrop pin pointing down -->
      <path d="M 0,-8
               C -5,-8 -5.5,-3 -5.5,0
               C -5.5,3.5 0,8.5 0,8.5
               C 0,8.5 5.5,3.5 5.5,0
               C 5.5,-3 5,-8 0,-8 Z"
            fill="white"/>
      <circle cx="0" cy="-2.8" r="2.2" fill="#20C997"/>
    </g>
  </g>
</svg>
