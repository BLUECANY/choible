<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>choible — 내 여행 프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap">
<style>
/* ─── Reset & Tokens ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6fa;
  --surface:#ffffff;
  --surface2:#f0f1f6;
  --border:#e4e6ef;
  --text:#1a1d2e;
  --text2:#5a607a;
  --text3:#9098b3;
  --accent:#4f6ef7;
  --accent2:#20c997;
  --accent-soft:#eef1fe;
  --danger:#f43f5e;
  --card-shadow:0 2px 12px rgba(79,110,247,.10);
  --card-hover-shadow:0 8px 32px rgba(79,110,247,.18);
  --radius:16px;
  --font:'Pretendard','Apple SD Gothic Neo',sans-serif;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13141f;
    --surface:#1e2030;
    --surface2:#252840;
    --border:#2d3050;
    --text:#e8eaf6;
    --text2:#8c93b8;
    --text3:#545c80;
    --accent:#6b87f8;
    --accent2:#2ed4a6;
    --accent-soft:#1c2260;
    --card-shadow:0 2px 12px rgba(0,0,0,.35);
    --card-hover-shadow:0 8px 32px rgba(107,135,248,.22);
  }
}
:root[data-theme="dark"]{
  --bg:#13141f;
  --surface:#1e2030;
  --surface2:#252840;
  --border:#2d3050;
  --text:#e8eaf6;
  --text2:#8c93b8;
  --text3:#545c80;
  --accent:#6b87f8;
  --accent2:#2ed4a6;
  --accent-soft:#1c2260;
  --card-shadow:0 2px 12px rgba(0,0,0,.35);
  --card-hover-shadow:0 8px 32px rgba(107,135,248,.22);
}

html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);}

/* ─── Layout ─── */
.app-shell{display:flex;flex-direction:column;min-height:100vh;}

/* ─── Header ─── */
header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 28px;
  height:60px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.logo{
  display:flex;align-items:center;gap:10px;
  font-size:20px;font-weight:800;color:var(--text);
  text-decoration:none;letter-spacing:-.5px;
}
.logo-dot{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:14px;color:#fff;
}
.header-right{display:flex;align-items:center;gap:12px;}
.btn{
  border:none;cursor:pointer;font-family:var(--font);
  display:inline-flex;align-items:center;gap:6px;
  transition:all .18s ease;font-weight:600;
}
.btn:active{transform:scale(.97);}
.btn-ghost{
  background:transparent;color:var(--text2);
  padding:6px 12px;border-radius:8px;font-size:14px;
}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.btn-primary{
  background:var(--accent);color:#fff;
  padding:8px 18px;border-radius:10px;font-size:14px;
  box-shadow:0 2px 8px rgba(79,110,247,.35);
}
.btn-primary:hover{
  background:#3a5ce8;
  box-shadow:0 4px 16px rgba(79,110,247,.45);
  transform:translateY(-1px);
}
.btn-new-lg{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;padding:12px 24px;border-radius:14px;font-size:15px;font-weight:700;
  box-shadow:0 4px 20px rgba(79,110,247,.30);
}
.btn-new-lg:hover{
  box-shadow:0 8px 28px rgba(79,110,247,.45);
  transform:translateY(-2px);
}

.avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:16px;
  cursor:pointer;transition:transform .18s;
}
.avatar:hover{transform:scale(1.1);}

/* ─── Main ─── */
main{flex:1;padding:32px 28px;max-width:1280px;margin:0 auto;width:100%;}

/* ─── Hero section (empty state) ─── */
.hero{
  text-align:center;padding:80px 20px 60px;
  animation:fadeUp .5s ease both;
}
.hero h1{font-size:36px;font-weight:800;letter-spacing:-.8px;margin-bottom:12px;}
.hero p{color:var(--text2);font-size:16px;margin-bottom:32px;line-height:1.6;}

/* ─── Section header ─── */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.section-header h2{font-size:18px;font-weight:700;}

/* ─── Search ─── */
.search-wrap{position:relative;max-width:320px;}
.search-wrap input{
  width:100%;padding:8px 12px 8px 36px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;font-size:14px;color:var(--text);
  font-family:var(--font);transition:border .18s,box-shadow .18s;
  outline:none;
}
.search-wrap input::placeholder{color:var(--text3);}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.15);}
.search-icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--text3);font-size:14px;pointer-events:none;
}

/* ─── Grid ─── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
}

/* ─── New project card ─── */
.card-new{
  aspect-ratio:4/5;
  border:2px dashed var(--border);
  border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;transition:all .2s ease;color:var(--text3);
  background:transparent;font-family:var(--font);
  position:relative;overflow:hidden;
}
.card-new:hover{
  border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft);
  transform:translateY(-3px);
}
.card-new-icon{
  width:52px;height:52px;border-radius:14px;
  background:var(--surface2);display:grid;place-items:center;
  font-size:24px;transition:all .2s;
}
.card-new:hover .card-new-icon{
  background:var(--accent);font-size:26px;
  box-shadow:0 4px 16px rgba(79,110,247,.35);
}
.card-new:hover .card-new-icon::after{content:'✈';font-style:normal;}
.card-new-icon::after{content:'+';}
.card-new span{font-size:14px;font-weight:600;}

/* ─── Project card ─── */
.card{
  aspect-ratio:4/5;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--card-shadow);
  display:flex;flex-direction:column;
  overflow:hidden;cursor:pointer;
  transition:all .22s cubic-bezier(.34,1.56,.64,1);
  position:relative;
  animation:fadeUp .4s ease both;
}
.card:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:var(--card-hover-shadow);
  border-color:transparent;
}
.card-thumb{
  flex:0 0 60%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  gap:8px;
}
.card-thumb-emoji{
  font-size:48px;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.2));
  transition:transform .3s ease;
}
.card:hover .card-thumb-emoji{transform:scale(1.15) rotate(-5deg);}
.card-thumb-places{
  font-size:12px;color:rgba(255,255,255,.85);font-weight:500;
  background:rgba(0,0,0,.18);backdrop-filter:blur(4px);
  padding:3px 10px;border-radius:20px;max-width:80%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* animated shimmer on thumb */
.card-thumb::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.1) 0%,transparent 60%);
  pointer-events:none;
}

.card-body{
  flex:1;padding:12px 14px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.card-title{
  font-size:14px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text);
}
.card-meta{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:6px;
}
.card-date{font-size:12px;color:var(--text3);}
.card-tag{
  font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;
}
.card-tag.cloud{background:rgba(79,110,247,.12);color:var(--accent);}
.card-tag.local{background:rgba(32,201,151,.12);color:var(--accent2);}

/* ─── Card menu ─── */
.card-menu-btn{
  position:absolute;top:10px;right:10px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(4px);
  border:none;border-radius:8px;width:28px;height:28px;
  display:grid;place-items:center;cursor:pointer;
  opacity:0;transition:opacity .18s;font-size:16px;
  color:#333;
}
.card:hover .card-menu-btn{opacity:1;}
.card-menu-btn:hover{background:#fff;transform:scale(1.1);}

/* ─── Dropdown ─── */
.dropdown{
  position:fixed;z-index:300;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:6px;min-width:150px;
  box-shadow:0 8px 32px rgba(0,0,0,.15);
  display:none;
  animation:fadeDown .15s ease;
}
.dropdown button{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:8px 12px;border:none;background:none;
  font-family:var(--font);font-size:13px;font-weight:500;
  color:var(--text);cursor:pointer;border-radius:8px;
  transition:background .12s;
}
.dropdown button:hover{background:var(--surface2);}
.dropdown button.danger{color:var(--danger);}
.dropdown button.danger:hover{background:rgba(244,63,94,.08);}

/* ─── Login Banner ─── */
.login-banner{
  background:linear-gradient(135deg,var(--accent-soft),rgba(32,201,151,.08));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 24px;
  display:flex;align-items:center;gap:16px;
  margin-bottom:28px;
  animation:fadeUp .4s ease both;
}
.login-banner-icon{font-size:32px;}
.login-banner-text{flex:1;font-size:14px;line-height:1.6;color:var(--text2);}
.login-banner-text strong{color:var(--text);display:block;margin-bottom:2px;}

/* ─── Auth Modal ─── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);
  z-index:500;display:none;place-items:center;
}
.modal-overlay.open{display:grid;}
.modal{
  background:var(--surface);border-radius:20px;padding:36px 32px;
  width:min(440px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.25);
  animation:scaleIn .25s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.modal h2{font-size:22px;font-weight:800;margin-bottom:6px;}
.modal p{color:var(--text2);font-size:14px;margin-bottom:24px;}
.modal-close{
  position:absolute;top:16px;right:16px;
  background:var(--surface2);border:none;border-radius:8px;
  width:32px;height:32px;font-size:18px;cursor:pointer;
  display:grid;place-items:center;color:var(--text2);transition:all .18s;
}
.modal-close:hover{background:var(--border);color:var(--text);}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text2);}
.form-group input{
  width:100%;padding:10px 14px;border:1.5px solid var(--border);
  border-radius:10px;font-size:15px;font-family:var(--font);
  background:var(--surface2);color:var(--text);outline:none;
  transition:border .18s,box-shadow .18s;
}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.15);}
.form-row{display:flex;gap:10px;margin-top:4px;}
.btn-full{width:100%;padding:12px;border-radius:12px;font-size:15px;justify-content:center;}
.auth-switch{text-align:center;margin-top:14px;font-size:13px;color:var(--text2);}
.auth-switch button{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px;padding:0;}
.auth-error{color:var(--danger);font-size:13px;margin-bottom:12px;display:none;}
.otp-wrap{display:none;}
.otp-hint{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.6;}

/* ─── Account menu ─── */
.acct-menu{
  position:fixed;top:66px;right:20px;z-index:300;
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:8px;min-width:200px;
  box-shadow:0 8px 32px rgba(0,0,0,.15);
  display:none;
  animation:fadeDown .15s ease;
}
.acct-menu.open{display:block;}
.acct-info{padding:10px 12px 12px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.acct-info p{font-size:12px;color:var(--text3);margin-bottom:2px;}
.acct-info strong{font-size:13px;word-break:break-all;}
.acct-menu button{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:8px 12px;border:none;background:none;
  font-family:var(--font);font-size:13px;font-weight:500;
  color:var(--text);cursor:pointer;border-radius:8px;transition:background .12s;
}
.acct-menu button:hover{background:var(--surface2);}
.acct-menu .danger{color:var(--danger);}
.acct-menu .danger:hover{background:rgba(244,63,94,.08);}

/* ─── Skeleton loader ─── */
.skeleton{
  background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.card-skel{aspect-ratio:4/5;border-radius:var(--radius);}

/* ─── Cloud sync badge ─── */
.sync-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;color:var(--text3);padding:4px 10px;
  background:var(--surface2);border-radius:20px;
}
.sync-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent2);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── Animations ─── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeDown{
  from{opacity:0;transform:translateY(-6px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(.92)}
  to{opacity:1;transform:scale(1)}
}

/* stagger cards */
.card:nth-child(2){animation-delay:.05s}
.card:nth-child(3){animation-delay:.1s}
.card:nth-child(4){animation-delay:.15s}
.card:nth-child(5){animation-delay:.2s}
.card:nth-child(6){animation-delay:.25s}
.card:nth-child(7){animation-delay:.3s}
.card:nth-child(8){animation-delay:.35s}

/* ─── Empty state ─── */
.empty{text-align:center;padding:60px 20px;color:var(--text3);grid-column:1/-1;}
.empty-icon{font-size:56px;margin-bottom:16px;display:block;}
.empty h3{font-size:18px;font-weight:700;color:var(--text2);margin-bottom:8px;}
.empty p{font-size:14px;line-height:1.6;}

/* ─── Toast ─── */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:10px 22px;
  border-radius:100px;font-size:14px;font-weight:600;
  opacity:0;transition:all .3s ease;pointer-events:none;z-index:9999;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ─── Responsive ─── */
@media(max-width:600px){
  main{padding:20px 16px;}
  header{padding:0 16px;}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px;}
  .hero h1{font-size:26px;}
  .login-banner{flex-direction:column;gap:12px;}
}
</style>
</head>
<body>
<div class="app-shell">
  <!-- Header -->
  <header>
    <a href="index.html" class="logo">
      <div class="logo-dot">C</div>
      choible
    </a>
    <div class="header-right">
      <div id="sync-badge" class="sync-badge" style="display:none">
        <div class="sync-dot"></div>
        <span>클라우드 동기화</span>
      </div>
      <button id="auth-btn" class="btn btn-ghost" onclick="handleAuthClick()">
        <span id="auth-label">로그인</span>
      </button>
      <div id="avatar-wrap" style="display:none">
        <div class="avatar" id="avatar-btn" onclick="toggleAcctMenu()">😊</div>
        <div class="acct-menu" id="acct-menu">
          <div class="acct-info">
            <p>로그인된 계정</p>
            <strong id="acct-email">—</strong>
          </div>
          <button onclick="doSignOut()">🔓 로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main id="main-content">
    <!-- Login banner (non-logged) -->
    <div id="login-banner" class="login-banner" style="display:none">
      <div class="login-banner-icon">☁️</div>
      <div class="login-banner-text">
        <strong>로그인하면 어디서든 여행을 불러올 수 있어요.</strong>
        지금은 이 기기에만 저장됩니다.
      </div>
      <button class="btn btn-primary" onclick="openAuthModal()">로그인 / 가입</button>
    </div>

    <!-- Section -->
    <div class="section-header">
      <h2>내 여행 프로젝트</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="여행 검색..." oninput="renderGrid()">
        </div>
        <button class="btn btn-primary" onclick="createNewProject()" style="white-space:nowrap">
          ✈ 새 여행
        </button>
      </div>
    </div>

    <!-- Grid -->
    <div class="grid" id="grid">
      <!-- skeleton -->
      <div class="skeleton card-skel"></div>
      <div class="skeleton card-skel"></div>
      <div class="skeleton card-skel"></div>
    </div>
  </main>
</div>

<!-- Dropdown -->
<div class="dropdown" id="dropdown"></div>

<!-- Auth Modal -->
<div class="modal-overlay" id="auth-modal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeAuthModal()">×</button>
    <h2 id="modal-title">로그인</h2>
    <p id="modal-sub">choible 계정으로 어디서든 여행을 불러오세요.</p>
    <div class="auth-error" id="auth-err"></div>

    <!-- Login / Signup form -->
    <div id="form-wrap">
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="f-email" placeholder="you@example.com" onkeydown="formKeyDown(event)">
      </div>
      <div class="form-group" id="pw-group">
        <label>비밀번호</label>
        <input type="password" id="f-pw" placeholder="••••••••" onkeydown="formKeyDown(event)">
      </div>
      <div class="form-group" id="pw2-group" style="display:none">
        <label>비밀번호 확인</label>
        <input type="password" id="f-pw2" placeholder="••••••••" onkeydown="formKeyDown(event)">
      </div>
      <button class="btn btn-primary btn-full" id="form-submit-btn" onclick="submitForm()">로그인</button>
      <div class="auth-switch">
        <span id="switch-text">계정이 없으신가요?</span>
        <button onclick="toggleMode()">가입하기</button>
      </div>
    </div>

    <!-- OTP verify -->
    <div class="otp-wrap" id="otp-wrap">
      <div class="otp-hint">
        📧 <strong id="otp-email-display"></strong>로 인증 코드를 보냈습니다.<br>
        이메일을 확인하고 8자리 코드를 입력하세요.
      </div>
      <div class="form-group">
        <label>인증 코드</label>
        <input type="text" id="f-otp" maxlength="8" placeholder="12345678"
               inputmode="numeric" pattern="[0-9]*"
               onkeydown="otpKeyDown(event)">
      </div>
      <div class="form-row">
        <button class="btn btn-ghost" style="flex:1;justify-content:center;padding:12px;border-radius:12px;" onclick="cancelOtp()">← 뒤로</button>
        <button class="btn btn-primary" style="flex:2;justify-content:center;padding:12px;border-radius:12px;" onclick="verifyOtp()">인증 완료</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.7/umd/supabase.min.js"></script>
<script>
// ─── Supabase ───
const SUPABASE_URL='https://rrssuofmyvfxzbliocmn.supabase.co';
const SUPABASE_ANON='sb_publishable_Bv7Ta8pBlrn8jyjKGoyNNQ_PjGWjCkH';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

let currentUser=null;
let allProjects=[];
let isSignupMode=false;
let pendingEmail='';

// ─── Palette for thumbnails ───
const PALETTES=[
  ['#4F6EF7','#20c997'],['#f97316','#f59e0b'],
  ['#ec4899','#f43f5e'],['#8b5cf6','#6366f1'],
  ['#10b981','#14b8a6'],['#3b82f6','#06b6d4'],
  ['#f43f5e','#fb923c'],['#a855f7','#ec4899'],
  ['#0ea5e9','#6366f1'],['#84cc16','#22c55e'],
];
function pickColor(str){
  let h=0;for(const c of(str||'?'))h=(h*31+c.charCodeAt(0))&0xffffffff;
  return PALETTES[Math.abs(h)%PALETTES.length];
}

// ─── Date formatting ───
function fmtDate(iso){
  if(!iso)return '';
  const d=new Date(iso),now=new Date();
  const m=Math.floor((now-d)/60000);
  if(m<1)return '방금 전';if(m<60)return `${m}분 전`;
  if(m<1440)return `${Math.floor(m/60)}시간 전`;
  if(m<2880)return '어제';
  return d.toLocaleDateString('ko-KR',{month:'short',day:'numeric'});
}

// ─── Local projects ───
function getLocal(){
  try{return JSON.parse(localStorage.getItem('choible_projects')||'[]');}catch{return[];}
}
function setLocal(list){localStorage.setItem('choible_projects',JSON.stringify(list));}
function previewText(data){
  const pl=(data?.places||[]);
  if(!pl.length)return '장소 없음';
  return pl[0].name+(pl.length>1?` 외 ${pl.length-1}곳`:'');
}

// ─── Load all projects ───
async function loadProjects(){
  allProjects=[];
  if(currentUser){
    const {data}=await sb.from('mindmaps')
      .select('id,title,updated_at,data')
      .eq('user_id',currentUser.id)
      .order('updated_at',{ascending:false});
    allProjects=(data||[]).map(p=>({
      id:p.id,cloud:true,
      title:p.title||'새 여행',
      updatedAt:p.updated_at,
      preview:previewText(p.data||{}),
    }));
  } else {
    allProjects=getLocal().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  }
  renderGrid();
}

// ─── Render grid ───
function renderGrid(){
  const grid=document.getElementById('grid');
  const q=(document.getElementById('search-input').value||'').toLowerCase();
  const filtered=allProjects.filter(p=>p.title.toLowerCase().includes(q)||!q);

  grid.innerHTML='';

  // New project card always first
  const newCard=document.createElement('div');
  newCard.className='card-new';
  newCard.setAttribute('tabindex','0');
  newCard.onclick=createNewProject;
  newCard.onkeydown=e=>{if(e.key==='Enter')createNewProject();};
  newCard.innerHTML=`<div class="card-new-icon"></div><span>새 여행 만들기</span>`;
  grid.appendChild(newCard);

  if(!filtered.length){
    const em=document.createElement('div');
    em.className='empty';
    em.innerHTML=q
      ? `<span class="empty-icon">🔍</span><h3>"${q}" 검색 결과 없음</h3><p>다른 키워드로 검색해보세요.</p>`
      : `<span class="empty-icon">🗺️</span><h3>아직 저장된 여행이 없어요</h3><p>새 여행 만들기를 눌러 첫 여행을 시작해보세요!</p>`;
    grid.appendChild(em);
    return;
  }

  filtered.forEach((p,i)=>{
    const [c1,c2]=pickColor(p.title);
    const emoji=[...p.title].find(c=>/\p{Emoji_Presentation}/u.test(c))||'✈';
    const card=document.createElement('div');
    card.className='card';
    card.style.animationDelay=(i*.05)+'s';
    card.innerHTML=`
      <div class="card-thumb" style="background:linear-gradient(135deg,${c1},${c2})">
        <div class="card-thumb-emoji">${emoji}</div>
        <div class="card-thumb-places">${p.preview||'장소 없음'}</div>
      </div>
      <button class="card-menu-btn" onclick="showCardMenu(event,'${p.id}',${!!p.cloud})" title="메뉴">⋯</button>
      <div class="card-body">
        <div class="card-title">${escHtml(p.title)}</div>
        <div class="card-meta">
          <span class="card-date">${fmtDate(p.updatedAt)}</span>
          <span class="card-tag ${p.cloud?'cloud':'local'}">${p.cloud?'☁ 클라우드':'📱 로컬'}</span>
        </div>
      </div>`;
    card.addEventListener('click',e=>{
      if(e.target.closest('.card-menu-btn'))return;
      openProject(p.id,p.cloud);
    });
    grid.appendChild(card);
  });
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Create new project ───
function createNewProject(){
  window.location.href='app.html?newproject=1';
}

// ─── Open project ───
function openProject(id,isCloud){
  window.location.href='app.html?project='+encodeURIComponent(id);
}

// ─── Card menu ───
let _menuId=null,_menuCloud=false;
function showCardMenu(e,id,isCloud){
  e.stopPropagation();
  _menuId=id;_menuCloud=isCloud;
  const dd=document.getElementById('dropdown');
  dd.innerHTML=`
    <button onclick="renameProject('${id}',${isCloud})">✏️ 이름 변경</button>
    ${isCloud?`<button onclick="shareProject('${id}')">🔗 공유 링크 복사</button>`:''}
    <button class="danger" onclick="deleteProject('${id}',${isCloud})">🗑️ 삭제</button>`;
  const rect=e.currentTarget.getBoundingClientRect();
  dd.style.display='block';
  dd.style.top=(rect.bottom+4)+'px';
  const left=Math.min(rect.left,window.innerWidth-170);
  dd.style.left=left+'px';
  setTimeout(()=>document.addEventListener('click',closeDropdown,{once:true}),10);
}
function closeDropdown(){document.getElementById('dropdown').style.display='none';}

async function renameProject(id,isCloud){
  closeDropdown();
  const proj=allProjects.find(p=>p.id===id);
  const t=prompt('새 이름:',proj?.title||'새 여행');
  if(!t)return;
  if(isCloud){
    await sb.from('mindmaps').update({title:t}).eq('id',id).eq('user_id',currentUser.id);
  } else {
    const list=getLocal();const p=list.find(p=>p.id===id);if(p)p.title=t;setLocal(list);
  }
  showToast('✅ 이름이 변경되었습니다');
  await loadProjects();
}

async function deleteProject(id,isCloud){
  closeDropdown();
  if(!confirm('이 여행을 삭제하시겠습니까? 되돌릴 수 없습니다.'))return;
  if(isCloud){
    await sb.from('mindmaps').delete().eq('id',id).eq('user_id',currentUser.id);
  } else {
    setLocal(getLocal().filter(p=>p.id!==id));
    localStorage.removeItem('choible_proj_'+id);
  }
  showToast('🗑️ 삭제되었습니다');
  await loadProjects();
}

async function shareProject(id){
  closeDropdown();
  const token='share_'+Math.random().toString(36).slice(2);
  await sb.from('mindmaps').update({share_token:token,is_public:true}).eq('id',id);
  const url=location.origin+'/app.html?share='+token;
  await navigator.clipboard.writeText(url).catch(()=>{});
  showToast('🔗 공유 링크가 클립보드에 복사되었습니다');
}

// ─── Auth UI ───
function updateAuthUI(user){
  const authBtn=document.getElementById('auth-btn');
  const avatarWrap=document.getElementById('avatar-wrap');
  const loginBanner=document.getElementById('login-banner');
  const syncBadge=document.getElementById('sync-badge');
  if(user){
    authBtn.style.display='none';
    avatarWrap.style.display='block';
    document.getElementById('acct-email').textContent=user.email;
    loginBanner.style.display='none';
    syncBadge.style.display='flex';
  } else {
    authBtn.style.display='';
    avatarWrap.style.display='none';
    loginBanner.style.display='flex';
    syncBadge.style.display='none';
  }
}

function handleAuthClick(){openAuthModal();}

function toggleAcctMenu(){
  const m=document.getElementById('acct-menu');
  m.classList.toggle('open');
  if(m.classList.contains('open')){
    setTimeout(()=>document.addEventListener('click',()=>m.classList.remove('open'),{once:true}),10);
  }
}

async function doSignOut(){
  await sb.auth.signOut();
  location.reload();
}

// ─── Auth Modal ───
function openAuthModal(){
  document.getElementById('auth-modal').classList.add('open');
  document.getElementById('auth-err').style.display='none';
  document.getElementById('auth-err').textContent='';
  document.getElementById('f-email').focus();
}
function closeAuthModal(){document.getElementById('auth-modal').classList.remove('open');}
function handleOverlayClick(e){if(e.target===document.getElementById('auth-modal'))closeAuthModal();}

function toggleMode(){
  isSignupMode=!isSignupMode;
  document.getElementById('modal-title').textContent=isSignupMode?'회원가입':'로그인';
  document.getElementById('modal-sub').textContent=isSignupMode
    ?'이메일과 비밀번호로 계정을 만드세요.'
    :'choible 계정으로 어디서든 여행을 불러오세요.';
  document.getElementById('pw2-group').style.display=isSignupMode?'block':'none';
  document.getElementById('form-submit-btn').textContent=isSignupMode?'가입하기':'로그인';
  document.getElementById('switch-text').textContent=isSignupMode?'이미 계정이 있으신가요?':'계정이 없으신가요?';
  document.querySelector('.auth-switch button').textContent=isSignupMode?'로그인':'가입하기';
  document.getElementById('auth-err').style.display='none';
}

function formKeyDown(e){if(e.key==='Enter')submitForm();}
function otpKeyDown(e){if(e.key==='Enter')verifyOtp();}

async function submitForm(){
  const email=document.getElementById('f-email').value.trim();
  const pw=document.getElementById('f-pw').value;
  const errEl=document.getElementById('auth-err');
  errEl.style.display='none';
  if(!email||!pw){errEl.textContent='이메일과 비밀번호를 입력해주세요.';errEl.style.display='block';return;}

  if(isSignupMode){
    const pw2=document.getElementById('f-pw2').value;
    if(pw!==pw2){errEl.textContent='비밀번호가 일치하지 않습니다.';errEl.style.display='block';return;}
    const {error}=await sb.auth.signUp({email,password:pw});
    if(error){errEl.textContent=error.message;errEl.style.display='block';return;}
    pendingEmail=email;
    document.getElementById('form-wrap').style.display='none';
    document.getElementById('otp-wrap').style.display='block';
    document.getElementById('otp-email-display').textContent=email;
    document.getElementById('f-otp').focus();
  } else {
    const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){errEl.textContent='이메일 또는 비밀번호가 올바르지 않습니다.';errEl.style.display='block';return;}
    closeAuthModal();
    showToast('✅ 로그인 되었습니다');
  }
}

async function verifyOtp(){
  const code=document.getElementById('f-otp').value.trim();
  const errEl=document.getElementById('auth-err');
  errEl.style.display='none';
  if(code.length<6){errEl.textContent='인증 코드를 확인해주세요.';errEl.style.display='block';return;}
  const {error}=await sb.auth.verifyOtp({email:pendingEmail,token:code,type:'signup'});
  if(error){errEl.textContent='인증 코드가 올바르지 않습니다. 다시 확인해주세요.';errEl.style.display='block';return;}
  closeAuthModal();
  showToast('🎉 가입 완료! 환영합니다');
}

function cancelOtp(){
  document.getElementById('otp-wrap').style.display='none';
  document.getElementById('form-wrap').style.display='block';
  document.getElementById('auth-err').style.display='none';
}

// ─── Toast ───
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

// ─── Local↔Cloud migration offer ───
async function offerMigration(user){
  const local=getLocal();
  if(!local.length)return;
  if(!confirm(`이 기기에 저장된 여행 ${local.length}개를 클라우드로 옮기시겠습니까?`))return;
  for(const p of local){
    const raw=localStorage.getItem('choible_proj_'+p.id);
    const data=raw?JSON.parse(raw):{};
    await sb.from('mindmaps').insert({user_id:user.id,title:p.title,data});
    localStorage.removeItem('choible_proj_'+p.id);
  }
  setLocal([]);
  showToast('☁️ 클라우드로 이전 완료!');
}

// ─── Init ───
sb.auth.onAuthStateChange(async(event,session)=>{
  const user=session?.user||null;
  const wasLoggedOut=!currentUser;
  currentUser=user;
  updateAuthUI(user);
  if(event==='SIGNED_IN' && wasLoggedOut && user){
    await offerMigration(user);
  }
  await loadProjects();
});
</script>
