<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>choible — 내 여행 프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f7f8fc;
  --surface:#ffffff;
  --surface2:#f0f2f8;
  --border:#e4e8f0;
  --text:#1b1e2e;
  --text2:#5a6280;
  --text3:#9098b3;
  --accent:#4f6ef7;
  --accent2:#20c997;
  --accent-soft:#eef1fe;
  --danger:#f43f5e;
  --radius:16px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(79,110,247,.10);
  --shadow-lg:0 8px 32px rgba(79,110,247,.16);
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111320;--surface:#1a1d2e;--surface2:#212437;--border:#2a2e45;
  --text:#e6e9f6;--text2:#8891b8;--text3:#4d5578;
  --accent:#6b87f8;--accent2:#2ed4a6;--accent-soft:#1c2260;
  --shadow-sm:0 1px 4px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.35);--shadow-lg:0 8px 32px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#111320;--surface:#1a1d2e;--surface2:#212437;--border:#2a2e45;
  --text:#e6e9f6;--text2:#8891b8;--text3:#4d5578;
  --accent:#6b87f8;--accent2:#2ed4a6;--accent-soft:#1c2260;
  --shadow-sm:0 1px 4px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.35);--shadow-lg:0 8px 32px rgba(0,0,0,.4);
}

html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);}

/* ── Page shell ── */
.page{display:flex;flex-direction:column;min-height:100vh;}

/* ── Header ── */
header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;
  box-shadow:var(--shadow-sm);
}
.logo{
  display:flex;align-items:center;gap:8px;
  text-decoration:none;color:var(--text);
  font-size:18px;font-weight:800;letter-spacing:-.5px;
}
.logo img{width:30px;height:30px;border-radius:8px;}
.logo-name{display:flex;align-items:baseline;gap:3px;}

.header-right{display:flex;align-items:center;gap:8px;}
.btn{
  border:none;cursor:pointer;font-family:var(--font);
  display:inline-flex;align-items:center;gap:6px;
  transition:all .18s;font-weight:600;line-height:1;
}
.btn:active{transform:scale(.97);}
.btn-ghost{
  background:none;color:var(--text2);
  padding:7px 14px;border-radius:9px;font-size:14px;
}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.btn-outline{
  background:none;color:var(--accent);
  border:1.5px solid var(--accent);
  padding:6px 16px;border-radius:9px;font-size:14px;
}
.btn-outline:hover{background:var(--accent-soft);}
.btn-primary{
  background:var(--accent);color:#fff;
  padding:8px 18px;border-radius:10px;font-size:14px;
  box-shadow:0 2px 8px rgba(79,110,247,.3);
}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 4px 14px rgba(79,110,247,.38);transform:translateY(-1px);}

.avatar-btn{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;cursor:pointer;color:#fff;font-size:14px;font-weight:700;
  display:grid;place-items:center;transition:transform .2s,box-shadow .2s;
}
.avatar-btn:hover{transform:scale(1.08);box-shadow:0 0 0 3px rgba(79,110,247,.25);}

/* ── Grid loading spinner (row) ── */
.grid-loading{
  grid-column:1/-1;
  display:flex;align-items:center;gap:10px;
  padding:40px 0;color:var(--text3);font-size:14px;
}
.spinner{
  width:20px;height:20px;border:2.5px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;flex-shrink:0;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Main ── */
main{flex:1;padding:28px 24px 48px;max-width:1200px;margin:0 auto;width:100%;}

/* ── Welcome banner (non-logged) ── */
.welcome-banner{
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
  border-radius:20px;padding:28px 32px;margin-bottom:28px;
  display:flex;align-items:center;gap:24px;
  color:#fff;
  box-shadow:0 6px 28px rgba(79,110,247,.30);
  animation:fadeUp .45s ease both;
}
.welcome-banner-icon{font-size:48px;flex-shrink:0;}
.welcome-banner-body{flex:1;}
.welcome-banner h2{font-size:20px;font-weight:800;margin-bottom:5px;}
.welcome-banner p{font-size:14px;opacity:.9;line-height:1.6;}
.btn-white{
  background:#fff;color:var(--accent);
  padding:9px 20px;border-radius:10px;font-size:14px;font-weight:700;
  border:none;cursor:pointer;white-space:nowrap;transition:all .18s;
  font-family:var(--font);flex-shrink:0;
}
.btn-white:hover{box-shadow:0 4px 14px rgba(0,0,0,.15);transform:translateY(-1px);}

/* ── Section toolbar ── */
.section-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;gap:12px;flex-wrap:wrap;
}
.section-bar h2{font-size:16px;font-weight:700;color:var(--text2);}
.search-box{
  display:flex;align-items:center;gap:6px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:10px;padding:7px 12px;transition:border .2s,box-shadow .2s;
  flex:1;max-width:280px;
}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.12);}
.search-box input{
  border:none;background:none;outline:none;
  font-family:var(--font);font-size:14px;color:var(--text);
  width:100%;
}
.search-box input::placeholder{color:var(--text3);}
.search-icon{color:var(--text3);font-size:14px;flex-shrink:0;}

/* ── New project hero button (big, at top of grid) ── */
.new-hero{
  background:linear-gradient(145deg,var(--accent-soft),var(--surface));
  border:2px dashed var(--accent);
  border-radius:var(--radius);
  padding:22px;
  display:flex;align-items:center;gap:16px;
  cursor:pointer;transition:all .22s;
  margin-bottom:24px;
  animation:fadeUp .4s ease both;
}
.new-hero:hover{
  background:var(--accent-soft);
  border-color:var(--accent);
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}
.new-hero-icon{
  width:52px;height:52px;border-radius:14px;
  background:var(--accent);
  display:grid;place-items:center;font-size:24px;
  flex-shrink:0;box-shadow:0 4px 12px rgba(79,110,247,.35);
  transition:transform .22s;
}
.new-hero:hover .new-hero-icon{transform:scale(1.08) rotate(-5deg);}
.new-hero-text h3{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:3px;}
.new-hero-text p{font-size:13px;color:var(--text2);}

/* ── Grid ── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:16px;
}

/* ── Project card ── */
.card{
  border-radius:var(--radius);
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  overflow:hidden;cursor:pointer;
  transition:transform .22s cubic-bezier(.34,1.3,.64,1),box-shadow .22s;
  position:relative;
  animation:fadeUp .35s ease both;
}
.card:hover{
  transform:translateY(-6px) scale(1.015);
  box-shadow:var(--shadow-lg);
  border-color:transparent;
}
.card-thumb{
  height:140px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;position:relative;overflow:hidden;
}
.card-thumb::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.07) 0%,transparent 50%,rgba(0,0,0,.12) 100%);
}
.card-emoji{
  font-size:44px;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.18));
  transition:transform .3s ease;
  position:relative;z-index:1;
}
.card:hover .card-emoji{transform:scale(1.2) rotate(-8deg);}
.card-places{
  font-size:11px;color:rgba(255,255,255,.88);font-weight:500;
  background:rgba(0,0,0,.22);backdrop-filter:blur(4px);
  padding:3px 10px;border-radius:20px;
  max-width:82%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  position:relative;z-index:1;
}
.card-body{padding:12px 14px;}
.card-title{
  font-size:13px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  margin-bottom:6px;
}
.card-footer{display:flex;align-items:center;justify-content:space-between;}
.card-date{font-size:11px;color:var(--text3);}
.card-badge{
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;
}
.card-badge.cloud{background:rgba(79,110,247,.12);color:var(--accent);}
.card-badge.local{background:rgba(32,201,151,.12);color:var(--accent2);}

/* card menu button */
.card-menu-btn{
  position:absolute;top:8px;right:8px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(4px);
  border:none;border-radius:7px;width:26px;height:26px;
  display:grid;place-items:center;cursor:pointer;
  opacity:0;transition:opacity .18s,transform .18s;font-size:15px;color:#333;z-index:2;
}
.card:hover .card-menu-btn,.card-menu-btn:focus{opacity:1;}
.card-menu-btn:hover{transform:scale(1.1);}

/* ── Skeleton ── */
.skel{
  background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:var(--radius);
  height:208px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Empty state ── */
.empty-state{
  grid-column:1/-1;
  text-align:center;padding:60px 20px;color:var(--text3);
}
.empty-state-icon{font-size:56px;display:block;margin-bottom:16px;}
.empty-state h3{font-size:17px;font-weight:700;color:var(--text2);margin-bottom:8px;}
.empty-state p{font-size:13px;line-height:1.7;}

/* ── Dropdown ── */
.dropdown{
  position:fixed;z-index:400;display:none;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:5px;min-width:160px;
  box-shadow:0 8px 28px rgba(0,0,0,.14);
  animation:fadeDown .14s ease;
}
.dropdown button{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:8px 12px;border:none;background:none;
  font-family:var(--font);font-size:13px;font-weight:500;
  color:var(--text);cursor:pointer;border-radius:8px;transition:background .12s;
}
.dropdown button:hover{background:var(--surface2);}
.dropdown .danger{color:var(--danger);}
.dropdown .danger:hover{background:rgba(244,63,94,.07);}

/* ── Account popover ── */
.acct-popover{
  position:fixed;top:62px;right:16px;z-index:300;display:none;
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:6px;min-width:210px;
  box-shadow:0 8px 28px rgba(0,0,0,.14);
  animation:fadeDown .15s ease;
}
.acct-popover.open{display:block;}
.acct-info{padding:10px 12px 12px;border-bottom:1px solid var(--border);margin-bottom:5px;}
.acct-info-email{font-size:12px;color:var(--text3);margin-bottom:2px;}
.acct-info-name{font-size:13px;font-weight:700;word-break:break-all;}
.acct-popover button{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:8px 12px;border:none;background:none;
  font-family:var(--font);font-size:13px;font-weight:500;
  color:var(--text);cursor:pointer;border-radius:8px;transition:background .12s;
}
.acct-popover button:hover{background:var(--surface2);}
.acct-popover .danger{color:var(--danger);}

/* ── Auth modal ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);
  z-index:500;display:none;place-items:center;
}
.modal-overlay.open{display:grid;}
.modal{
  background:var(--surface);border-radius:22px;padding:36px 32px 28px;
  width:min(430px,92vw);box-shadow:0 24px 64px rgba(0,0,0,.22);
  animation:scaleIn .24s cubic-bezier(.34,1.56,.64,1);position:relative;
}
.modal-close{
  position:absolute;top:14px;right:14px;
  background:var(--surface2);border:none;border-radius:8px;
  width:30px;height:30px;font-size:17px;cursor:pointer;
  display:grid;place-items:center;color:var(--text2);transition:all .15s;
}
.modal-close:hover{background:var(--border);color:var(--text);}
.modal h2{font-size:22px;font-weight:800;margin-bottom:4px;}
.modal .modal-sub{font-size:14px;color:var(--text2);margin-bottom:22px;line-height:1.6;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--text2);letter-spacing:.3px;text-transform:uppercase;}
.form-group input{
  width:100%;padding:10px 14px;
  border:1.5px solid var(--border);border-radius:10px;
  font-size:15px;font-family:var(--font);
  background:var(--surface2);color:var(--text);outline:none;
  transition:border .18s,box-shadow .18s;
}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.14);}
.btn-full{width:100%;justify-content:center;padding:12px;border-radius:12px;font-size:15px;margin-top:4px;}
.auth-err{
  font-size:13px;color:var(--danger);
  background:rgba(244,63,94,.07);border-radius:8px;
  padding:8px 12px;margin-bottom:12px;display:none;
}
.auth-switch{text-align:center;margin-top:14px;font-size:13px;color:var(--text2);}
.auth-switch button{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-size:13px;font-family:var(--font);}
.otp-area{display:none;}
.otp-hint{
  background:var(--accent-soft);border-radius:10px;padding:12px 14px;
  font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px;
}
.otp-hint strong{color:var(--accent);}
.form-row{display:flex;gap:8px;margin-top:4px;}

/* ── Toast ── */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--text);color:var(--bg);
  padding:9px 22px;border-radius:100px;
  font-size:14px;font-weight:600;
  opacity:0;transition:all .28s ease;pointer-events:none;z-index:9999;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Footer ── */
footer{
  background:var(--surface);border-top:1px solid var(--border);
  padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;
}
.footer-left{font-size:12px;color:var(--text3);}
.footer-links{display:flex;align-items:center;gap:16px;}
.footer-links a{
  font-size:12px;color:var(--text3);text-decoration:none;
  transition:color .15s;
}
.footer-links a:hover{color:var(--text2);}
.footer-sep{color:var(--border);}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

/* stagger */
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}
.card:nth-child(6){animation-delay:.20s}.card:nth-child(7){animation-delay:.24s}
.card:nth-child(8){animation-delay:.28s}.card:nth-child(9){animation-delay:.32s}

/* ── Responsive ── */
@media(max-width:600px){
  main{padding:20px 14px 40px;}
  header{padding:0 14px;}
  .welcome-banner{flex-direction:column;gap:14px;padding:22px 18px;}
  .welcome-banner .btn-white{width:100%;justify-content:center;}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  footer{flex-direction:column;align-items:flex-start;gap:8px;}
}
</style>
</head>
<body>

<div class="page" id="page-body">

  <!-- Header -->
  <header>
    <a href="index.html" class="logo">
      <img src="choible-icon.svg" alt="choible">
      <span class="logo-name">choible</span>
    </a>
    <div class="header-right">
      <!-- shown only when logged in -->
      <div id="sync-indicator" style="display:none;align-items:center;gap:5px;font-size:12px;color:var(--accent2);font-family:var(--font);font-weight:600;">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--accent2);display:inline-block;animation:pulse 2s infinite"></span>
        클라우드 연결
      </div>
      <!-- shown only when NOT logged in -->
      <button id="header-login-btn" class="btn btn-outline" onclick="openAuthModal()" style="display:none">로그인 / 가입</button>
      <!-- shown only when logged in -->
      <div id="header-user" style="display:none;position:relative;">
        <button class="avatar-btn" id="avatar-btn" onclick="toggleAcctMenu()">
          <span id="avatar-initial">?</span>
        </button>
        <div class="acct-popover" id="acct-popover">
          <div class="acct-info">
            <div class="acct-info-email">로그인된 계정</div>
            <div class="acct-info-name" id="acct-email">—</div>
          </div>
          <button onclick="doSignOut()">🔓 로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main>

    <!-- Welcome banner — shown only when NOT logged in -->
    <div id="welcome-banner" class="welcome-banner" style="display:none">
      <div class="welcome-banner-icon">🌍</div>
      <div class="welcome-banner-body">
        <h2>로그인하면 모든 기기에서 여행을 불러올 수 있어요</h2>
        <p>지금은 이 기기에만 저장됩니다. 로그인하면 클라우드에 자동 동기화됩니다.</p>
      </div>
      <button class="btn-white" onclick="openAuthModal()">무료로 가입하기 →</button>
    </div>

    <!-- New project hero button — ALWAYS visible -->
    <div class="new-hero" onclick="createNewProject()" role="button" tabindex="0"
         onkeydown="if(event.key==='Enter')createNewProject()">
      <div class="new-hero-icon">✈️</div>
      <div class="new-hero-text">
        <h3>새 여행 만들기</h3>
        <p id="new-hero-sub">새로운 여행 플랜을 시작해보세요</p>
      </div>
    </div>

    <!-- Section bar -->
    <div class="section-bar">
      <h2>저장된 여행</h2>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="여행 검색..." oninput="renderGrid()" aria-label="여행 검색" autocomplete="off">
      </div>
    </div>

    <!-- Grid -->
    <div class="grid" id="grid">
      <div class="skel"></div>
      <div class="skel"></div>
      <div class="skel"></div>
      <div class="skel"></div>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-left">© 2025 choible.com — 여행 마인드맵</div>
    <div class="footer-links">
      <a href="privacy.html">개인정보처리방침</a>
      <span class="footer-sep">|</span>
      <a href="mailto:ch52maker@gmail.com">버그 제보 / 문의</a>
      <span class="footer-sep">|</span>
      <a href="index.html">홈으로</a>
    </div>
  </footer>

</div><!-- /.page -->

<!-- Card dropdown -->
<div class="dropdown" id="dropdown"></div>

<!-- Auth modal -->
<div class="modal-overlay" id="auth-modal" onclick="handleModalOverlay(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeAuthModal()">×</button>
    <h2 id="modal-title">로그인</h2>
    <p class="modal-sub" id="modal-sub">choible 계정으로 어디서든 여행을 불러오세요.</p>
    <div class="auth-err" id="auth-err"></div>

    <!-- Login / Signup -->
    <div id="auth-form">
      <div class="form-group">

/* ── Palette ── */
const PAL=[
  ['#4F6EF7','#20c997'],['#f97316','#f59e0b'],
  ['#ec4899','#f43f5e'],['#8b5cf6','#6366f1'],
  ['#10b981','#14b8a6'],['#3b82f6','#06b6d4'],
  ['#f43f5e','#fb923c'],['#a855f7','#ec4899'],
  ['#0ea5e9','#6366f1'],['#84cc16','#22c55e'],
];
function pickPal(str){
  let h=0;for(const c of(str||'?'))h=(h*31+c.charCodeAt(0))&0xffffffff;
  return PAL[Math.abs(h)%PAL.length];
}
function fmtDate(iso){
  if(!iso)return '';
  const d=new Date(iso),now=new Date();
  const m=Math.floor((now-d)/60000);
  if(m<1)return '방금 전';if(m<60)return `${m}분 전`;
  if(m<1440)return `${Math.floor(m/60)}시간 전`;
  if(m<2880)return '어제';
  return d.toLocaleDateString('ko-KR',{month:'short',day:'numeric'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ── Load and render projects ── */
async function loadProjects(){
  const grid=document.getElementById('grid');
  allProjects=[];

  // 비로그인: 로컬 즉시 렌더, 스켈레톤 없이
  if(!currentUser){
    allProjects=getLocal().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
    renderGrid();
    return;
  }

  // 로그인: 로컬 우선 즉시 표시 후 클라우드 병합
  const localList = getLocal().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  allProjects = localList;
  renderGrid(); // 로컬 먼저 즉시 표시

  if(!sb){ return; } // SDK 없으면 로컬만

  try{
    // 6초 타임아웃으로 클라우드 쿼리
    const queryPromise = sb.from('mindmaps')
      .select('id,title,updated_at,data')
      .eq('user_id', currentUser.id)
      .order('updated_at', {ascending:false});
    const timeoutPromise = new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),6000));
    const {data, error} = await Promise.race([queryPromise, timeoutPromise]);
    if(!error && data && data.length){
      const cloudProjects = data.map(p=>({
        id: p.id, cloud: true,
        title: p.title || '새 여행',
        updatedAt: p.updated_at,
        preview: previewText(p.data||{}),
      }));
      // 로컬 + 클라우드 병합 (중복 ID 제거, 최신순)
      const cloudIds = new Set(cloudProjects.map(p=>p.id));
      const mergedLocal = localList.filter(p=>!cloudIds.has(p.id));
      allProjects = [...cloudProjects, ...mergedLocal]
        .sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
      renderGrid(); // 병합 결과 다시 렌더
    }
  }catch(e){
    // 타임아웃이나 오류: 이미 로컬이 표시됨, 유지
  }
}

function renderGrid(){
  const grid=document.getElementById('grid');
  const q=(document.getElementById('search-input').value||'').toLowerCase().trim();
  const list=allProjects.filter(p=>!q||p.title.toLowerCase().includes(q));

  grid.innerHTML='';

  if(!list.length){
    const em=document.createElement('div');
    em.className='empty-state';
    em.innerHTML=q
      ? `<span class="empty-state-icon">🔍</span><h3>"${esc(q)}" 검색 결과가 없어요</h3><p>다른 키워드로 검색해보세요.</p>`
      : `<span class="empty-state-icon">🗺️</span><h3>아직 저장된 여행이 없어요</h3><p>위의 <strong>새 여행 만들기</strong>를 눌러 첫 여행 플랜을 시작해보세요!</p>`;
    grid.appendChild(em);
    return;
  }

  list.forEach((p,i)=>{
    const [c1,c2]=pickPal(p.title);
    const chars=[...p.title];
    const emoji=chars.find(c=>/\p{Emoji_Presentation}/u.test(c))||chars[0]||'✈';
    const card=document.createElement('div');
    card.className='card';
    card.style.animationDelay=(i*.04)+'s';
    card.innerHTML=`
      <div class="card-thumb" style="background:linear-gradient(135deg,${c1},${c2})">
        <div class="card-emoji">${emoji}</div>
        <div class="card-places">${esc(p.preview||'장소 없음')}</div>
      </div>
      <button class="card-menu-btn" onclick="showMenu(event,'${esc(p.id)}',${!!p.cloud})" title="더 보기" tabindex="0">⋯</button>
      <div class="card-body">
        <div class="card-title" title="${esc(p.title)}">${esc(p.title)}</div>
        <div class="card-footer">
          <span class="card-date">${fmtDate(p.updatedAt)}</span>
          <span class="card-badge ${p.cloud?'cloud':'local'}">${p.cloud?'☁ 클라우드':'📱 로컬'}</span>
        </div>
      </div>`;
    card.addEventListener('click',e=>{if(!e.target.closest('.card-menu-btn'))openProject(p.id);});
    grid.appendChild(card);
  });

  // 한도 카운트 표시 업데이트
  const subEl = document.getElementById('new-hero-sub');
  if(subEl){
    const total = allProjects.length;
    if(!isPremium()){
      const remain = FREE_LIMIT - total;
      if(remain <= 0){
        subEl.innerHTML = `<span style="color:#f43f5e;font-weight:700">한도 도달 (${total}/${FREE_LIMIT})</span> — 삭제 후 추가 가능`;
      } else {
        subEl.textContent = `새로운 여행 플랜을 시작해보세요 (${total}/${FREE_LIMIT})`;
      }
    } else {
      subEl.textContent = '새로운 여행 플랜을 시작해보세요';
    }
  }
  // 총 프로젝트 수를 localStorage에 캐시 (app.html에서 제한 체크에 사용)
  try{ localStorage.setItem('choible_proj_count', allProjects.length); }catch(_){}
}

          <button onclick="document.getElementById('limit-modal').style.display='none'" style="padding:10px 20px;border:none;border-radius:10px;background:linear-gradient(135deg,#4f6ef7,#7c6be0);color:#fff;font-size:13px;font-weight:700;cursor:pointer;opacity:.5" title="준비 중">⭐ 프리미엄 (준비 중)</button>

let _mid=null,_mcloud=false;
function showMenu(e,id,isCloud){
  e.stopPropagation();
  _mid=id;_mcloud=isCloud;
  const dd=document.getElementById('dropdown');

    <button onclick="renameP('${esc(id)}',${isCloud})">✏️ 이름 변경</button>

function closeMenu(){document.getElementById('dropdown').style.display='none';}

async function renameP(id,isCloud){
  closeMenu();
  const p=allProjects.find(x=>x.id===id);
  const t=prompt('새 이름:',p?.title||'새 여행');
  if(!t)return;
  if(isCloud){await sb.from('mindmaps').update({title:t}).eq('id',id).eq('user_id',currentUser.id);}
  else{const l=getLocal();const x=l.find(p=>p.id===id);if(x)x.title=t;setLocal(l);}
  showToast('✅ 이름이 변경되었습니다');
  await loadProjects();
}

async function deleteP(id,isCloud){
  closeMenu();
  if(!confirm('이 여행을 삭제하시겠습니까? 되돌릴 수 없습니다.'))return;
  if(isCloud){await sb.from('mindmaps').delete().eq('id',id).eq('user_id',currentUser.id);}
  else{setLocal(getLocal().filter(p=>p.id!==id));localStorage.removeItem('choible_proj_'+id);}
  showToast('🗑️ 삭제되었습니다');
  await loadProjects();
}

async function shareP(id){
  closeMenu();
  const token='share_'+Math.random().toString(36).slice(2);
  await sb.from('mindmaps').update({share_token:token,is_public:true}).eq('id',id);
  const url=location.origin+'/app.html?share='+token;
  await navigator.clipboard.writeText(url).catch(()=>{});
  showToast('🔗 공유 링크가 클립보드에 복사되었습니다');
}

async function submitForm(){
  const email=document.getElementById('f-email').value.trim();
  const pw=document.getElementById('f-pw').value;
  const errEl=document.getElementById('auth-err');
  errEl.style.display='none';
  if(!email||!pw){errEl.textContent='이메일과 비밀번호를 입력해주세요.';errEl.style.display='block';return;}
  const btn=document.getElementById('form-btn');
  btn.disabled=true;btn.textContent='처리 중…';
  if(isSignupMode){
    const pw2=document.getElementById('f-pw2').value;
    if(pw!==pw2){errEl.textContent='비밀번호가 일치하지 않습니다.';errEl.style.display='block';btn.disabled=false;btn.textContent='가입하기';return;}
    if(!sb){errEl.textContent='인증 서비스를 사용할 수 없습니다.';errEl.style.display='block';btn.disabled=false;btn.textContent='가입하기';return;}
    const {error}=await sb.auth.signUp({email,password:pw});
    btn.disabled=false;btn.textContent='가입하기';
    if(error){errEl.textContent=error.message;errEl.style.display='block';return;}
    pendingEmail=email;
    document.getElementById('auth-form').style.display='none';
    document.getElementById('otp-area').style.display='block';
    document.getElementById('otp-target').textContent=email;
    document.getElementById('auth-err').style.display='none';
    setTimeout(()=>document.getElementById('f-otp').focus(),100);
  } else {
    if(!sb){errEl.textContent='인증 서비스를 사용할 수 없습니다.';errEl.style.display='block';btn.disabled=false;btn.textContent='로그인';return;}
    const {error}=await sb.auth.signInWithPassword({email,password:pw});
    btn.disabled=false;btn.textContent='로그인';
    if(error){errEl.textContent='이메일 또는 비밀번호가 올바르지 않습니다.';errEl.style.display='block';return;}
    closeAuthModal();showToast('✅ 로그인 되었습니다');
  }
}

async function verifyOtp(){
  const code=document.getElementById('f-otp').value.trim();
  const errEl=document.getElementById('auth-err');
  errEl.style.display='none';
  if(code.length<6){errEl.textContent='인증 코드를 확인해주세요.';errEl.style.display='block';return;}
  if(!sb){errEl.textContent='인증 서비스를 사용할 수 없습니다.';errEl.style.display='block';return;}
  const {error}=await sb.auth.verifyOtp({email:pendingEmail,token:code,type:'signup'});
  if(error){errEl.textContent='코드가 틀렸거나 만료되었습니다.';errEl.style.display='block';return;}
  closeAuthModal();showToast('🎉 가입 완료! 환영합니다');
}

function cancelOtp(){
  document.getElementById('otp-area').style.display='none';
  document.getElementById('auth-form').style.display='block';
  document.getElementById('auth-err').style.display='none';
}

/* ── Local→Cloud migration ── */
async function offerMigration(user){
  const local=getLocal();
  if(!local.length)return;
  if(!confirm(`이 기기에 저장된 여행 ${local.length}개를 클라우드로 옮기시겠습니까?`))return;
  for(const p of local){
    const raw=localStorage.getItem('choible_proj_'+p.id);
    const data=raw?JSON.parse(raw):{};
    await sb.from('mindmaps').insert({user_id:user.id,title:p.title,data});
    localStorage.removeItem('choible_proj_'+p.id);
  }
  setLocal([]);
  showToast('☁️ 클라우드로 이전 완료!');
}

/* ── Bootstrap ── */
// 1) 항상 즉시 렌더 (스피너 없음, 스켈레톤 즉시 교체)
updateHeader(null);

// 2) SDK 없으면 여기서 종료 (로컬 전용 모드)
if(sb){
  // 세션 확인 후 클라우드 로드
  sb.auth.getSession().then(({data:{session}})=>{
    const user=session?.user||null;
    if(user){
      currentUser=user;
      updateHeader(user);
      loadProjects(); // 클라우드 프로젝트 로드
    }
  }).catch(()=>{/* 세션 조회 실패 시 비로그인 상태 유지 */});

  // 로그인/로그아웃 이벤트 감지
  sb.auth.onAuthStateChange(async(event,session)=>{
    const user=session?.user||null;
    const prevId=currentUser?.id;
    if(user?.id===prevId && event!=='SIGNED_OUT') return;
    currentUser=user;
    updateHeader(user);
    if(event==='SIGNED_IN'){
      await offerMigration(user);
      await loadProjects();
    } else if(event==='SIGNED_OUT'){
      await loadProjects();
    }
  });
}
</script>
